server {
    listen 80;
    # 5173: the port the platform-generated nginx upstream (`web:5173`) uses;
    # 80 stays for the legacy infra/deploy path until it is retired (E11).
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
