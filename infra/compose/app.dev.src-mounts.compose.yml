# =============================================================================
# App overlay (scope dev: applies to dev and devdb) - hot-reload source mounts
# =============================================================================
# The platform's dev.compose.yml mounts the source under /app/apps/api/src and
# /app/apps/web/src, the monorepo layout. Vault's images (app.build.compose.yml)
# run from /app, so the source belongs at /app/src and /app/prisma. `!override`
# replaces the platform's volume list for these services (Compose merges
# volumes by container path, which would leave the platform's mounts in place).
# =============================================================================

services:
  api:
    volumes: !override
      - ../../apps/api/src:/app/src:ro
      - ../../apps/api/prisma:/app/prisma:ro
  web:
    volumes: !override
      - ../../apps/web/src:/app/src:ro
