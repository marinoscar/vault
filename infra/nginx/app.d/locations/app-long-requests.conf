# =============================================================================
# This app's long-running API routes (APP-OWNED)
# =============================================================================
# The platform's generic `location /api` allows the API 60 s between bytes of
# a response. Vault has three routes that can take longer before the first
# byte, and the platform's default would cut them off with a 504:
#
#   POST /api/secrets/cards/extract   a vision-model call on a card photo
#   POST /api/secrets/export          a raw zip of the user's secrets
#   POST /api/admin/backups/export    a raw zip of the whole deployment
#
# Each is an exact-match location (it wins over the prefix `location /api`) with
# the generic block's headers and a 600 s read timeout, as the nginx of this app
# set for all of `/api` before. Every other route keeps the platform's 60 s.
# No add_header here, so the server-level security headers are inherited.
# =============================================================================

location = /api/secrets/cards/extract {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
}

location = /api/secrets/export {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
