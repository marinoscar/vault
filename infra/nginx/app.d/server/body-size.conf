# =============================================================================
# Request body limit of this app (APP-OWNED)
# =============================================================================
# The platform's nginx.conf sets no client_max_body_size, so nginx's 1 MiB
# default would refuse every upload to the API with a 413 that never reaches
# it. Vault's API enforces the real ceilings itself (MAX_FILE_SIZE, the card
# image cap CARD_IMAGE_MAX_BYTES), so this is the outer bound the proxy keeps,
# as the nginx of this app has always set it (10 GB; the VPS edge proxy in
# infra/deploy/vault.conf sets 0 = no limit and is a separate layer).
# Server level, so every location inherits it.
# =============================================================================

client_max_body_size 10g;
