name: Vault packages

# Build, pack-check and docs-check the publishable @marinoscar/vault-* packages
# (contract, db, api, web; a package whose folder does not exist yet is skipped).
# Publishing is vault-release.yml's job. The standard these jobs enforce:
# docs/PACKAGES.md.
#
# ci.yml keeps the `Packages` job (typecheck and test, with the Postgres service
# vault-db's real-database test needs) and builds the packages in every job that
# imports them. This workflow adds the checks that only matter when a package
# changes (pack contents, README standard, changeset) and runs on the paths below.

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/vault-*/**'
      - 'scripts/vault-packages/**'
      - '.changeset/**'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/*/package.json'
      - 'docs/PACKAGES.md'
      - '.github/workflows/vault-packages.yml'
  push:
    branches: [main]
    paths:
      - 'packages/vault-*/**'
      - 'scripts/vault-packages/**'
      - '.changeset/**'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/*/package.json'
      - 'docs/PACKAGES.md'
      - '.github/workflows/vault-packages.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, check and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run build:packages

      # Asks npm what each package would publish and compares it with the
      # manifest. Needs the build above.
      - run: npm run check:package-pack

      - name: Smoke-import every entry point
        run: |
          node -e "require('@marinoscar/vault-contract')"
          node -e "require('@marinoscar/vault-contract/secrets')"
          node -e "require('@marinoscar/vault-contract/errors')"
          node --input-type=module -e "await import('@marinoscar/vault-contract')"
          node --input-type=module -e "await import('@marinoscar/vault-contract/backups')"
          node packages/vault-db/bin/vault-db.js --help

  package-scripts:
    name: Package script tests
    # Unit tests of the pack check's rules (allow-list, exports walk, vault-db
    # and vault-contract requirements, absolute-path and card-number scans).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Node built-ins only: no install needed.
      - run: npm run test:package-scripts

  package-docs:
    name: Package docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Node built-ins only: no install needed.
      - run: npm run check:package-docs

  platform-compat:
    name: Platform compatibility
    # docs/PACKAGES.md, "Platform compatibility": the compatibility table, the
    # @marinoscar/platform-* peers of the four packages, vault-api's
    # SUPPORTED_PLATFORM_RANGE and the workspace pins must agree. Its output is
    # the matrix of the next job, so the range tested is the range declared.
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.range.outputs.versions }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Node built-ins only: no install needed.
      - run: npm run check:platform-compat

      - id: range
        run: echo "versions=$(node scripts/vault-packages/platform-compat.mjs --matrix)" >> "$GITHUB_OUTPUT"

  platform-range:
    name: Platform range (${{ matrix.platform }})
    # Installs the lowest and the highest platform version of the declared range
    # and runs the package build, typecheck, tests and the vault-api conformance
    # spec on each. A failing cell narrows the range in the peers; it is never
    # skipped or allowed to fail.
    needs: platform-compat
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platform-compat.outputs.versions) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Re-pin every workspace @marinoscar/platform-* dependency (root, apps,
      # packages; never a peer) to this cell's version, then let npm resolve it.
      - name: Install @marinoscar/platform-* ${{ matrix.platform }}
        run: |
          node scripts/vault-packages/platform-compat.mjs --use "${{ matrix.platform }}"
          npm install --no-audit --no-fund
          npm ls @marinoscar/platform-api @marinoscar/platform-contract @marinoscar/platform-web @marinoscar/platform-db
          # What each package resolves (npm may nest instead of hoisting).
          test "$(cd packages/vault-api && node -p "require('@marinoscar/platform-api/package.json').version")" = "${{ matrix.platform }}"
          test "$(cd packages/vault-web && node -p "require('@marinoscar/platform-web/package.json').version")" = "${{ matrix.platform }}"

      - run: npm run build:packages

      - run: npm run typecheck:packages

      # vault-db's apply.db.test.ts uses the Postgres service; vault-api's specs
      # (the forRoot platform check included) use fakes for every port.
      - name: Test the packages
        run: npm run test:packages
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Conformance over fake ports
        working-directory: packages/vault-api
        run: npx jest --config ./test/jest.config.js --ci test/conformance.spec.ts

  changeset-status:
    name: Changeset status
    # A pull request that changes a package source needs a changeset. The
    # version pull request that vault-release.yml opens consumes the changesets
    # and is the one exception.
    if: github.event_name == 'pull_request' && github.head_ref != 'vault-release/version'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: git fetch origin main
      - run: npx changeset status --since=origin/main
