name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  api-check:
    name: API Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # @marinoscar/vault-contract and vault-db are workspace packages the apps import
      # as built output (dist/ is git-ignored): build them right after the install.
      - name: Build the Vault packages
        run: npm run build:packages

      # prisma/schema/ is GENERATED from the platform-db fragments plus
      # prisma/fragments/*.prisma; a stale or hand-edited copy fails here.
      - name: Check the composed Prisma schema is up to date
        run: npm run db:compose:check --workspace=api

      # platform db check (platform.lock) and vault-db check (vault.lock, the domain fragments
      # and migrations installed from @marinoscar/vault-db).
      - name: Check installed platform and domain migrations against platform.lock and vault.lock
        run: npm run db:check --workspace=api

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=api

      - name: Type check API
        run: npm run typecheck --workspace=api

      - name: Run API tests
        run: npm test --workspace=api
        env:
          NODE_ENV: test

  db-check:
    name: DB Check (migrate + seed on Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # The image's bootstrap login is a SUPERUSER; the API and the tests
          # connect as the ordinary role created below, so row-level security
          # is enforced (issue #75).
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "p@ss/word:ci"
          POSTGRES_DB: vault_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vault_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      # The ORDINARY application role (NOSUPERUSER NOBYPASSRLS, owns the tables).
      POSTGRES_USER: vault_app
      POSTGRES_PASSWORD: "p@ss/word:ci"
      POSTGRES_DB: vault_ci
      INITIAL_ADMIN_EMAIL: admin@example.test
      # Test-only credential store key (base64, 32 bytes); never a real key.
      SECRETS_ENCRYPTION_KEY: dmF1bHQtdGVzdC1zZWNyZXRzLWVuY3J5cHRpb24tazE=
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # @marinoscar/vault-contract and vault-db are workspace packages the apps import
      # as built output (dist/ is git-ignored): build them right after the install.
      - name: Build the Vault packages
        run: npm run build:packages

      - name: Create the ordinary application role (vault_app)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGPASSWORD: "p@ss/word:ci"
          APP_DB_USER: vault_app
          APP_DB_PASSWORD: "p@ss/word:ci"
        run: bash infra/compose/postgres-init/10-application-role.sh

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=api

      - name: Check the composed Prisma schema is up to date
        run: npm run db:compose:check --workspace=api

      # platform db check (platform.lock) and vault-db check (vault.lock, the domain fragments
      # and migrations installed from @marinoscar/vault-db).
      - name: Check installed platform and domain migrations against platform.lock and vault.lock
        run: npm run db:check --workspace=api

      # A FRESH database: the original 7 migrations, the 38 installed platform
      # migrations (0003-0040) and the media_folder_files app migration, in order.
      - name: Apply migrations
        run: npm run prisma:migrate --workspace=api

      - name: Seed (connects through the PrismaPg adapter)
        run: npm run prisma:seed --workspace=api

      - name: Ledger, lock and files agree
        run: npm run db:check:database --workspace=api

      - name: Migrations equal the schema (drift)
        run: npm run db:drift --workspace=api

      # Connects as vault_app, so the RLS suites (test/rls, role-attributes)
      # run against an ordinary role; the bootstrap superuser (postgres, same
      # password) is only used to create their scratch databases.
      - name: Real-Postgres tests
        run: npm run test:db --workspace=api
        env:
          NODE_ENV: test

  baseline-rehearsal:
    name: Baseline rehearsal (pre-platform database to platform history)
    runs-on: ubuntu-latest
    # Rehearses docs/runbooks/database-baseline.md on a database in the shape
    # production has TODAY: only the original seven migrations, with invented
    # rows. Proves the committed platform.lock and installed directories adopt
    # it without --apply (the files are already committed) and that the data
    # survives the platform migrations. It does not replace the rehearsal on a
    # restored production backup, which the runbook requires.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "p@ss/word:ci"
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      # The ORDINARY application role; the bootstrap superuser (postgres) only
      # creates the database and the role.
      POSTGRES_USER: vault_app
      POSTGRES_PASSWORD: "p@ss/word:ci"
      POSTGRES_DB: vault_rehearsal
      PGPASSWORD: "p@ss/word:ci"
      INITIAL_ADMIN_EMAIL: admin@example.test
      SECRETS_ENCRYPTION_KEY: dmF1bHQtdGVzdC1zZWNyZXRzLWVuY3J5cHRpb24tazE=
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # @marinoscar/vault-contract and vault-db are workspace packages the apps import
      # as built output (dist/ is git-ignored): build them right after the install.
      - name: Build the Vault packages
        run: npm run build:packages

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=api

      - name: Build the pre-baseline database (7 original migrations + fixture rows)
        working-directory: apps/api
        run: |
          createdb -h localhost -U postgres vault_rehearsal
          PGHOST=localhost APP_DB_USER=vault_app APP_DB_PASSWORD="$PGPASSWORD" \
            bash ../../infra/compose/postgres-init/10-application-role.sh
          bash scripts/baseline-rehearsal.sh

      # B1-B6 dry run: must end "dry run clean" or "nothing to do". The gate
      # runs BEFORE prisma:migrate, so it uses --through 2 --allow-rls (see the
      # runbook: --allow-rls is the explicit opt-in to the row-level-security
      # migrations above --through; the role here is already the ordinary one).
      #
      # platform.lock `rlsPolicies` lists media_folder_files_org_isolation (E6.2), which
      # the app migration creates AFTER this gate; the baseline asserts every listed
      # policy exists, so the plain command would refuse (POLICY_MISSING) here.
      # `db:baseline:pre-migrate` runs the same command against a temporary copy of the
      # lock without `rlsPolicies` (scripts/baseline-pre-migrate.mjs); the real lock is
      # never touched. db:drift below still checks the policy on the migrated database.
      - name: Baseline dry run (through 2)
        working-directory: apps/api
        run: |
          set -o pipefail
          npm run db:baseline:pre-migrate | tee /tmp/baseline-dry-run.txt
          grep -q "nothing to do" /tmp/baseline-dry-run.txt

      - name: Apply the installed platform migrations (0003-0040) and the media_folder_files migration
        run: npm run prisma:migrate --workspace=api

      - name: Seed
        run: npm run prisma:seed --workspace=api

      - name: Ledger, lock, files and schema agree
        working-directory: apps/api
        run: |
          npm run db:check:database
          npm run db:drift
          set -o pipefail
          npm run db:baseline | tee /tmp/baseline-after.txt
          grep -q "nothing to do" /tmp/baseline-after.txt

      - name: The data survived (0024 role split, 0025 org backfill, media links)
        run: |
          # As the bootstrap superuser: vault_app sees no storage_objects row
          # without an organization scope, which would make the NULL check vacuous.
          q() { psql -h localhost -U postgres -d vault_rehearsal -At -c "$1"; }
          test "$(q "SELECT count(*) FROM memberships")" = "3"
          test "$(q "SELECT r.name FROM memberships m JOIN roles r ON r.id = m.role_id JOIN users u ON u.id = m.user_id WHERE u.email = 'contributor@example.test'")" = "contributor"
          test "$(q "SELECT r.name FROM user_roles ur JOIN roles r ON r.id = ur.role_id")" = "admin"
          test "$(q "SELECT count(*) FROM storage_objects WHERE org_id IS NULL")" = "0"
          test "$(q "SELECT count(*) FROM media_folder_files")" = "2"
          test "$(q "SELECT count(*) FROM secret_versions WHERE is_current")" = "1"
          test "$(q "SELECT count(*) FROM secret_attachments")" = "1"
          test "$(q "SELECT count(*) FROM secret_attachments sa JOIN storage_objects so ON so.id = sa.storage_object_id AND so.org_id = sa.org_id")" = "1"
          test "$(q "SELECT count(*) FROM secret_attachments WHERE org_id IS NULL")" = "0"
          test "$(q "SELECT count(*) FROM pg_policies WHERE tablename = 'media_folder_files'")" = "1"

  packages:
    name: Packages (vault-contract, vault-db)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "p@ss/word:ci"
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the packages
        run: npm run build:packages

      - name: Type check the packages
        run: npm run typecheck:packages

      # vault-db's apply.db.test.ts applies the platform history and then the domain history to
      # a scratch database it creates and drops itself.
      - name: Test the packages
        run: npm run test:packages
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:p%40ss%2Fword%3Aci@localhost:5432/postgres

  web-check:
    name: Web Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # @marinoscar/vault-contract and vault-db are workspace packages the apps import
      # as built output (dist/ is git-ignored): build them right after the install.
      - name: Build the Vault packages
        run: npm run build:packages

      - name: Type check Web
        run: npm run typecheck --workspace=web

      - name: Type check Web tests
        run: npm run typecheck:test --workspace=web

      - name: Run Web tests
        run: npm run test:run --workspace=web
        env:
          NODE_ENV: test

  infra-check:
    name: Infra Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Only the platform-infra bin is needed; lifecycle scripts of the whole
      # workspace are not.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # infra/ is GENERATED by @marinoscar/platform-infra and the app's overlays
      # (infra/compose/app.*.compose.yml, infra/nginx/app.d/, app.env.example).
      # A hand-edited generated file, or a lock out of step with the package, fails here.
      - name: Check generated infra matches platform-infra
        run: npm run platform:infra:sync -- --check

      # Every mode must render with the app's overlays applied. Placeholder values
      # satisfy the required variables; nothing is started.
      - name: Render every compose mode with the app overlays
        working-directory: infra/compose
        env:
          DEPLOY_ROOT: /opt/vault
          STACK_AGENT_TOKEN: ci-placeholder-stack-agent-token-0000000000
          JWT_SECRET: ci-placeholder
          COOKIE_SECRET: ci-placeholder
          GREPTIME_WRITER_PASSWORD: ci-placeholder
          GREPTIME_READER_PASSWORD: ci-placeholder
          GREPTIME_ADMIN_PASSWORD: ci-placeholder
          VAULT_SERVER_URL: https://vault.example.test
          VAULT_TOKEN: ci-placeholder
        run: |
          set -e
          docker compose -f base.compose.yml -f dev.compose.yml config > /dev/null
          docker compose -f base.compose.yml -f dev.compose.yml -f devdb.compose.yml config > /dev/null
          docker compose -f base.compose.yml -f prod.compose.yml config > /dev/null
          docker compose -f base.compose.yml -f prod.compose.yml -f telemetry.compose.yml -f vps.compose.yml -f vps.telemetry.compose.yml -f app.vps.no-stack-agent.compose.yml config > /dev/null
          docker compose -f worker.compose.yml -f worker.build.compose.yml config > /dev/null
          docker compose -f test.compose.yml config > /dev/null

  # The images build from the REPOSITORY ROOT (workspace packages and the root
  # lockfile must be in the context, issue #144). Nothing else builds them, so a
  # broken Dockerfile would otherwise reach a deploy. No push.
  docker-build:
    name: Docker build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the ${{ matrix.app }} production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: production
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  cli-check:
    name: CLI Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check CLI
        run: npm run typecheck --workspace=cli

      - name: Run CLI tests
        run: npm run test:run --workspace=cli
        env:
          NODE_ENV: test

      - name: Build CLI and print its help
        run: |
          npm run build --workspace=cli
          node apps/cli/dist/cli.js --help
          node apps/cli/dist/cli.js secrets --help

  # E10.7 (#98). Both suites serve the BUILT web app with `vite preview` and answer
  # /api at the network layer (tests/support/mock-api.ts): no backend, database or
  # AI key, and the e2e suite does NOT exercise the real API. They run in the
  # Playwright image because pixel baselines depend on the browser build and its
  # system libraries; the tag equals the pinned @playwright/test version.
  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install and build the web app
        run: |
          npm ci
          npm run build:packages
          npm run build --workspace=web

      - name: Install the visual suite
        run: npm ci --ignore-scripts
        working-directory: tests/visual

      - name: Check that baselines exist
        id: baselines
        run: |
          if ls tests/visual/specs/__screenshots__/*/*.png >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No visual baselines committed yet. Run the 'Visual baselines' workflow (workflow_dispatch) and merge its commit; see docs/TESTING.md#visual-regression."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run visual regression
        if: steps.baselines.outputs.present == 'true'
        run: ../../tests/visual/node_modules/.bin/playwright test
        working-directory: tests/visual
        env:
          CI: 'true'

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            tests/visual/playwright-report
            tests/visual/test-results
          if-no-files-found: ignore

  e2e:
    name: E2E (mocked network)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install and build the web app
        run: |
          npm ci
          npm run build:packages
          npm run build --workspace=web

      - name: Install the e2e suite
        run: npm ci --ignore-scripts
        working-directory: tests/e2e

      - name: Run e2e
        run: ../../tests/e2e/node_modules/.bin/playwright test
        working-directory: tests/e2e
        env:
          CI: 'true'

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
