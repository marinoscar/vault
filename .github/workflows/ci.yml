name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  api-check:
    name: API Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # prisma/schema/ is GENERATED from the platform-db fragments plus
      # prisma/fragments/*.prisma; a stale or hand-edited copy fails here.
      - name: Check the composed Prisma schema is up to date
        run: npm run db:compose:check --workspace=api

      - name: Check installed platform migrations against platform.lock
        run: npm run db:check --workspace=api

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=api

      - name: Type check API
        run: npm run typecheck --workspace=api

      - name: Run API tests
        run: npm test --workspace=api
        env:
          NODE_ENV: test

  db-check:
    name: DB Check (migrate + seed on Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # The image's bootstrap login is a SUPERUSER; the API and the tests
          # connect as the ordinary role created below, so row-level security
          # is enforced (issue #75).
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "p@ss/word:ci"
          POSTGRES_DB: vault_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vault_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      # The ORDINARY application role (NOSUPERUSER NOBYPASSRLS, owns the tables).
      POSTGRES_USER: vault_app
      POSTGRES_PASSWORD: "p@ss/word:ci"
      POSTGRES_DB: vault_ci
      INITIAL_ADMIN_EMAIL: admin@example.test
      # Test-only credential store key (base64, 32 bytes); never a real key.
      SECRETS_ENCRYPTION_KEY: dmF1bHQtdGVzdC1zZWNyZXRzLWVuY3J5cHRpb24tazE=
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create the ordinary application role (vault_app)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGPASSWORD: "p@ss/word:ci"
          APP_DB_USER: vault_app
          APP_DB_PASSWORD: "p@ss/word:ci"
        run: bash infra/compose/postgres-init/10-application-role.sh

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=api

      - name: Check the composed Prisma schema is up to date
        run: npm run db:compose:check --workspace=api

      - name: Check installed platform migrations against platform.lock
        run: npm run db:check --workspace=api

      # A FRESH database: the original 7 migrations, the 38 installed platform
      # migrations (0003-0040) and the media_folder_files app migration, in order.
      - name: Apply migrations
        run: npm run prisma:migrate --workspace=api

      - name: Seed (connects through the PrismaPg adapter)
        run: npm run prisma:seed --workspace=api

      - name: Ledger, lock and files agree
        run: npm run db:check:database --workspace=api

      - name: Migrations equal the schema (drift)
        run: npm run db:drift --workspace=api

      # Connects as vault_app, so the RLS suites (test/rls, role-attributes)
      # run against an ordinary role; the bootstrap superuser (postgres, same
      # password) is only used to create their scratch databases.
      - name: Real-Postgres tests
        run: npm run test:db --workspace=api
        env:
          NODE_ENV: test

  baseline-rehearsal:
    name: Baseline rehearsal (pre-platform database to platform history)
    runs-on: ubuntu-latest
    # Rehearses docs/runbooks/database-baseline.md on a database in the shape
    # production has TODAY: only the original seven migrations, with invented
    # rows. Proves the committed platform.lock and installed directories adopt
    # it without --apply (the files are already committed) and that the data
    # survives the platform migrations. It does not replace the rehearsal on a
    # restored production backup, which the runbook requires.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "p@ss/word:ci"
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      # The ORDINARY application role; the bootstrap superuser (postgres) only
      # creates the database and the role.
      POSTGRES_USER: vault_app
      POSTGRES_PASSWORD: "p@ss/word:ci"
      POSTGRES_DB: vault_rehearsal
      PGPASSWORD: "p@ss/word:ci"
      INITIAL_ADMIN_EMAIL: admin@example.test
      SECRETS_ENCRYPTION_KEY: dmF1bHQtdGVzdC1zZWNyZXRzLWVuY3J5cHRpb24tazE=
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=api

      - name: Build the pre-baseline database (7 original migrations + fixture rows)
        working-directory: apps/api
        run: |
          createdb -h localhost -U postgres vault_rehearsal
          PGHOST=localhost APP_DB_USER=vault_app APP_DB_PASSWORD="$PGPASSWORD" \
            bash ../../infra/compose/postgres-init/10-application-role.sh
          bash scripts/baseline-rehearsal.sh

      # B1-B6 dry run: must end "dry run clean" or "nothing to do". The gate
      # runs BEFORE prisma:migrate, so it uses --through 2 --allow-rls (see the
      # runbook: --allow-rls is the explicit opt-in to the row-level-security
      # migrations above --through; the role here is already the ordinary one).
      - name: Baseline dry run (through 2)
        working-directory: apps/api
        run: |
          set -o pipefail
          npm run db:baseline -- --through 2 --allow-rls | tee /tmp/baseline-dry-run.txt
          grep -q "nothing to do" /tmp/baseline-dry-run.txt

      - name: Apply the installed platform migrations (0003-0040) and the media_folder_files migration
        run: npm run prisma:migrate --workspace=api

      - name: Seed
        run: npm run prisma:seed --workspace=api

      - name: Ledger, lock, files and schema agree
        working-directory: apps/api
        run: |
          npm run db:check:database
          npm run db:drift
          set -o pipefail
          npm run db:baseline | tee /tmp/baseline-after.txt
          grep -q "nothing to do" /tmp/baseline-after.txt

      - name: The data survived (0024 role split, 0025 org backfill, media links)
        run: |
          # As the bootstrap superuser: vault_app sees no storage_objects row
          # without an organization scope, which would make the NULL check vacuous.
          q() { psql -h localhost -U postgres -d vault_rehearsal -At -c "$1"; }
          test "$(q "SELECT count(*) FROM memberships")" = "3"
          test "$(q "SELECT r.name FROM memberships m JOIN roles r ON r.id = m.role_id JOIN users u ON u.id = m.user_id WHERE u.email = 'contributor@example.test'")" = "contributor"
          test "$(q "SELECT r.name FROM user_roles ur JOIN roles r ON r.id = ur.role_id")" = "admin"
          test "$(q "SELECT count(*) FROM storage_objects WHERE org_id IS NULL")" = "0"
          test "$(q "SELECT count(*) FROM media_folder_files")" = "2"
          test "$(q "SELECT count(*) FROM secret_versions WHERE is_current")" = "1"
          test "$(q "SELECT count(*) FROM secret_attachments")" = "1"

  web-check:
    name: Web Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check Web
        run: npm run typecheck --workspace=web

      - name: Type check Web tests
        run: npm run typecheck:test --workspace=web

      - name: Run Web tests
        run: npm run test:run --workspace=web
        env:
          NODE_ENV: test

  cli-check:
    name: CLI Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check CLI
        run: npm run typecheck --workspace=cli

      - name: Run CLI tests
        run: npm run test:run --workspace=cli
        env:
          NODE_ENV: test

      - name: Build CLI and print its help
        run: |
          npm run build --workspace=cli
          node apps/cli/dist/cli.js --help
          node apps/cli/dist/cli.js secrets --help
