name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  api-check:
    name: API Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: apps/api

      - name: Type check API
        run: npm run typecheck --workspace=api

      - name: Run API tests
        run: npm test --workspace=api
        env:
          NODE_ENV: test

  db-check:
    name: DB Check (migrate + seed on Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: "p@ss/word:ci"
          POSTGRES_DB: vault_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vault -d vault_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: "p@ss/word:ci"
      POSTGRES_DB: vault_ci
      INITIAL_ADMIN_EMAIL: admin@example.test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=api

      - name: Apply migrations
        run: npm run prisma:migrate --workspace=api

      - name: Seed (connects through the PrismaPg adapter)
        run: npm run prisma:seed --workspace=api

  web-check:
    name: Web Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check Web
        run: npm run typecheck --workspace=web

      - name: Type check Web tests
        run: npm run typecheck:test --workspace=web

      - name: Run Web tests
        run: npm run test:run --workspace=web
        env:
          NODE_ENV: test
