name: Vault release

# Versions and publishes the @marinoscar/vault-* packages (contract, db, api, web)
# as one fixed group, in pre-release mode on the `next` dist-tag. Modelled on the
# KVox release workflow (jobs version, gate, publish, publish-dry-run).
#
#   push to main with pending changesets
#       -> version: opens or updates the "vault-release/version" pull request
#          (changeset version + lockfile refresh).
#   push to main with no pending changeset (the version pull request merged,
#   or any package change that carries none)
#       -> gate: reads the version, asks the registry whether it is published
#          and whether the package names exist.
#       -> publish          when NPM_PUBLISH_ENABLED is "true" and the gate is ready
#       -> publish-dry-run  otherwise: builds, packs, runs `npm publish --dry-run`
#                           and uploads the tarballs
#
# The package list is DERIVED from the folders present
# (scripts/vault-packages/list-packages.mjs), so the workflow works before
# vault-api and vault-web exist.
#
# NO NPM TOKEN ANYWHERE. `publish` authenticates with OIDC trusted publishing
# (id-token: write, from the protected environment `npm-publish`) and publishes
# with provenance. The gate runs without credentials and treats any registry
# error as "not ready", so a misconfiguration selects the dry run and never
# publishes half a release. `--tag latest` is never passed: a pre-release goes
# to the dist-tag in .changeset/pre.json (`next`).
#
# workflow_dispatch runs the same path on any branch; the publish job is
# refused off main by the environment's branch rule.
#
# Owner setup (one time) and rollback: docs/runbooks/release-vault-packages.md.

on:
  push:
    branches: [main]
    paths:
      - 'packages/vault-*/**'
      - '.changeset/**'
      - 'scripts/vault-packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/vault-release.yml'
  workflow_dispatch:

concurrency:
  group: vault-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pending: ${{ steps.pending.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Count pending changesets
        id: pending
        run: |
          # In pre mode `changeset version` leaves the consumed changesets in
          # place and lists them in pre.json, so only the unlisted ones are pending.
          count=$(node -e "
            const fs = require('fs');
            let consumed = [];
            try { consumed = JSON.parse(fs.readFileSync('.changeset/pre.json', 'utf8')).changesets; } catch {}
            const pending = fs.readdirSync('.changeset')
              .filter((f) => f.endsWith('.md') && f !== 'README.md')
              .filter((f) => !consumed.includes(f.slice(0, -3)));
            console.log(pending.length);
          ")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "pending changesets: $count"

      - name: Open or update the version pull request
        # Only on main: a manual run on a branch must not push a release branch.
        if: steps.pending.outputs.count != '0' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C vault-release/version
          npm run version-packages
          git add -A
          if git diff --cached --quiet; then
            echo "changeset version produced no change: nothing to open"
            exit 0
          fi
          git commit -m 'chore(infra): version vault packages'
          git push --force origin vault-release/version
          body='Generated by `vault-release.yml` from the pending changesets (`changeset version`). Merging it publishes the `@marinoscar/vault-*` packages to the `next` dist-tag (or runs the dry run when `NPM_PUBLISH_ENABLED` is not `true`). Procedure: docs/runbooks/release-vault-packages.md.'
          # `gh pr view <branch>` also finds a MERGED earlier version PR, so ask for open ones only.
          open_pr=$(gh pr list --head vault-release/version --state open --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --body "$body"
          else
            gh pr create --base main --head vault-release/version \
              --title 'chore(infra): version vault packages' --body "$body"
          fi

  gate:
    name: Release gate
    needs: version
    if: needs.version.outputs.pending == '0'
    runs-on: ubuntu-latest
    # No credentials: read-only token, public registry queries only.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
      publish: ${{ steps.gate.outputs.publish }}
      dry_run: ${{ steps.gate.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Decide
        id: gate
        env:
          NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
          # A manual run on a branch can only ever be a dry run.
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          # The packages present, in publish order (a missing folder is skipped with a notice).
          packages=$(node scripts/vault-packages/list-packages.mjs)
          if [ -z "$packages" ]; then
            echo "::error::no packages/vault-* package found"
            exit 1
          fi
          set -- $packages
          first=$1
          version=$(node -p "require('./packages/vault-$first/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          publish=false
          dry_run=false

          # 0.0.0 is an unversioned source; there is nothing to release yet.
          if [ "$version" = "0.0.0" ]; then
            echo "version is 0.0.0: nothing to release"
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "dry_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The packages must share the version (the fixed group).
          for p in $packages; do
            v=$(node -p "require('./packages/vault-$p/package.json').version")
            if [ "$v" != "$version" ]; then
              echo "::error::@marinoscar/vault-$p is $v but vault-$first is $version; the fixed group is out of step"
              exit 1
            fi
          done

          ready=true
          published=0
          for p in $packages; do
            name="@marinoscar/vault-$p"
            # 1. Does the name exist on the registry? (Trusted publishing can only
            #    be attached to a name that exists; the runbook bootstraps them.)
            if out=$(npm view "$name" name 2>&1); then
              :
            elif echo "$out" | grep -q 'E404'; then
              echo "::warning::$name does not exist on npm yet (bootstrap not done): dry run only"
              ready=false
              continue
            else
              echo "::warning::registry error for $name, treating the release as not ready: $out"
              ready=false
              continue
            fi
            # 2. Is this version already published?
            if out=$(npm view "$name@$version" version 2>&1); then
              echo "$name@$version is already published"
              published=$((published + 1))
            elif echo "$out" | grep -q 'E404'; then
              echo "$name@$version is not published yet"
            else
              echo "::warning::registry error for $name@$version, treating the release as not ready: $out"
              ready=false
            fi
          done

          total=$#
          if [ "$published" -eq "$total" ]; then
            echo "all $total packages are already at $version: nothing to do"
          elif [ "$ON_MAIN" != "true" ]; then
            echo "not on main: dry run only"
            dry_run=true
          elif [ "$published" -ne 0 ]; then
            # A previous publish stopped half way. The publish job skips the
            # packages already at this version, so a re-run finishes the rest.
            echo "::warning::$published of $total packages are already published at $version; publishing the rest"
            if [ "$NPM_PUBLISH_ENABLED" = "true" ] && [ "$ready" = "true" ]; then publish=true; else dry_run=true; fi
          elif [ "$NPM_PUBLISH_ENABLED" = "true" ] && [ "$ready" = "true" ]; then
            publish=true
          else
            dry_run=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          {
            echo "### Release gate"
            echo "- packages: \`$packages\`"
            echo "- version: \`$version\`"
            echo "- NPM_PUBLISH_ENABLED: \`${NPM_PUBLISH_ENABLED:-unset}\`"
            echo "- registry ready: \`$ready\`"
            echo "- result: publish=\`$publish\`, dry_run=\`$dry_run\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to npm
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Required reviewer, main only (repository settings). The only job with
    # id-token: write, and the only one that can push a tag.
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g 'npm@^11.5.1'

      - run: npm ci

      - run: npm run build:packages
      - run: npm run check:package-pack

      - name: Publish (OIDC, provenance)
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          # A pre-release goes to the dist-tag recorded by `changeset pre enter`.
          tag_args=""
          if [ -f .changeset/pre.json ]; then
            tag=$(node -p "require('./.changeset/pre.json').tag")
            if [ -z "$tag" ] || [ "$tag" = "latest" ]; then
              echo "::error::.changeset/pre.json has tag '$tag'; refusing to publish a pre-release to latest"
              exit 1
            fi
            tag_args="--tag $tag"
          fi
          for p in $(node scripts/vault-packages/list-packages.mjs); do
            name="@marinoscar/vault-$p"
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION already published, skipping"
              continue
            fi
            # shellcheck disable=SC2086
            npm publish -w "$name" --access public $tag_args
          done

      - name: Tag the release
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "vault-packages-v$VERSION"
          git push origin "vault-packages-v$VERSION"

  publish-dry-run:
    name: Publish dry run
    needs: gate
    if: needs.gate.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run build:packages
      - run: npm run check:package-pack

      - name: Pack the tarballs and dry-run the publish
        run: |
          tag=next
          if [ -f .changeset/pre.json ]; then tag=$(node -p "require('./.changeset/pre.json').tag"); fi
          mkdir -p vault-tarballs
          for p in $(node scripts/vault-packages/list-packages.mjs); do
            npm pack -w "@marinoscar/vault-$p" --pack-destination vault-tarballs
            # Provenance needs the OIDC token only the publish job has.
            npm publish -w "@marinoscar/vault-$p" --access public --tag "$tag" --dry-run --provenance=false
          done
          ls -l vault-tarballs

      - uses: actions/upload-artifact@v4
        with:
          name: vault-tarballs
          path: vault-tarballs/*.tgz
          if-no-files-found: error

      - name: Explain
        env:
          NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
        run: |
          {
            echo "### Dry run: nothing was published"
            echo "Either \`NPM_PUBLISH_ENABLED\` is not \`true\` (it is \`${NPM_PUBLISH_ENABLED:-unset}\`), the run is not on main, or the gate found the registry not ready."
            echo "The tarballs are attached as the \`vault-tarballs\` artifact. See docs/runbooks/release-vault-packages.md."
          } >> "$GITHUB_STEP_SUMMARY"
